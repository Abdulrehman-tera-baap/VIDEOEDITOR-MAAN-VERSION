
name: MAAN Video Editor - Android APK Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAAN APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect Android project location
      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Android project found in repository root"

          elif [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
            echo "Android project found in android folder"

          else
            echo "ERROR: gradlew not found!"
            echo "Make sure your repository contains an Android Gradle project."
            exit 1
          fi

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Give Gradle permission
      - name: Grant Gradle Permission
        shell: bash
        run: |
          chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      # 6. Build Android Debug APK
      - name: Build MAAN Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload APK
      - name: Upload MAAN APK
        uses: actions/upload-artifact@v4
        with:
          name: MAAN-Video-Editor-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 8. Build completed
      - name: Build Status
        if: success()
        run: echo "MAAN Video Editor APK generated successfully!"
